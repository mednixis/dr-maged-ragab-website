          <p data-ar="أسرع طريقة للحجز أو السؤال. التأكيد يصلك على نفس الرقم." data-en="The fastest way to book or ask. Your confirmation arrives on the same number."></p>
          <a class="more" href="#" onclick="return false" dir="ltr">+20 103 931 0401</a>
        </div>
        <div class="card">
          <span class="card-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span>
          <h3 data-ar="اتصال هاتفي" data-en="By phone"></h3>
          <p data-ar="للحجز الفوري أو الاستفسار عن المواعيد المتاحة." data-en="For immediate booking or to ask about availability."></p>
          <a class="more" href="#" onclick="return false" dir="ltr">+20 103 931 0403</a>
        </div>
        <div class="card">
          <span class="card-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></span>
          <h3 data-ar="الحجز الإلكتروني" data-en="Book online"></h3>
          <p data-ar="ثلاث خطوات، بدون حساب وبدون دفع إلكتروني." data-en="Three steps, no account and no online payment."></p>
          <a class="more" href="#/ar/booking" data-route="booking"><span data-ar="ابدأ الحجز" data-en="Start booking"></span><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>
        </div>
      </div>

<section class="page" data-page="faq" hidden>
  <section class="sec">
    <div class="wrap">
      <div class="sec-head">
        <p class="eyebrow" style="justify-content:center"><span class="ln"></span><span data-ar="قبل أن تحجز" data-en="Before you book"></span></p>
        <h1 style="font-size:clamp(32px,4.6vw,54px)" data-ar="أسئلة يسألها كل مريض" data-en="Questions every patient asks"></h1>
      </div>
      <div class="grid g2" style="gap:26px 44px" id="faqList"></div>
    </div>
  </section>

  <section class="sec sec-ink">
    <div class="wrap" style="display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
      <h2 data-ar="لم تجد إجابتك؟" data-en="Didn't find your answer?"></h2>
      <p data-ar="راسلنا على واتساب — سنرد عليك خلال ساعات العمل." data-en="Message us on WhatsApp — we'll reply during working hours."></p>
      <a class="btn btn-pri btn-lg" style="margin-top:8px" href="#/ar/clinics" data-route="clinics" data-ar="تواصل مع العيادة" data-en="Contact the clinic"></a>
    </div>
  </section>
</section>
<section class="page" data-page="booking" hidden>

  <div class="rail">
    <div class="wrap rail-in">
      <span class="rail-s" data-step="1"><i>1</i><span data-ar="العيادة والموعد" data-en="Clinic &amp; time"></span></span>
      <span class="rail-ln"></span>
      <span class="rail-s" data-step="2"><i>2</i><span data-ar="اسمك ورقمك" data-en="Name &amp; number"></span></span>
      <span class="rail-ln"></span>
      <span class="rail-s" data-step="3"><i>3</i><span data-ar="تأكيد واتساب" data-en="WhatsApp confirmation"></span></span>
    </div>
  </div>

  <!-- ========== STEP 1 + 2 share the summary rail ========== -->
  <div class="wrap bk" id="bkShell">
    <div class="bk-main">

      <p class="err err-submit" id="errSubmit" hidden></p>

      <!-- step 1 -->
      <div id="step1">
        <div class="fset">
          <h2><span class="num">1</span> · <span data-ar="اختر العيادة" data-en="Choose your clinic"></span></h2>
          <div class="grid g2" id="clinicPick"></div>
        </div>
        <div class="fset" style="margin-top:28px">
          <h2><span class="num">2</span> · <span data-ar="اختر اليوم" data-en="Choose the day"></span></h2>
          <div class="days" id="dayPick"></div>
        </div>
        <div class="fset" style="margin-top:28px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <h2><span class="num">3</span> · <span data-ar="اختر الوقت" data-en="Choose the time"></span></h2>
            <span style="font-size:14px;color:var(--muted)" id="freeCount"></span>
          </div>
          <div id="slotsWrap">
            <div class="slots">
              <span class="slot-lbl" data-ar="بعد الظهر" data-en="Afternoon"></span>
              <div class="chips" id="slotsNoon"></div>
            </div>
            <div class="slots" style="margin-top:6px">
              <span class="slot-lbl" data-ar="مساءً" data-en="Evening"></span>
              <div class="chips" id="slotsEve"></div>
            </div>
            <span class="legend"><i></i><span data-ar="المواعيد الباهتة محجوزة بالفعل" data-en="Faded times are already booked"></span></span>
          </div>
          <p class="slots-msg" id="slotsMsg" hidden></p>
        </div>
      </div>

      <!-- step 2 -->
      <form id="step2" hidden novalidate>
        <div class="fset">
          <h2 data-ar="بياناتك" data-en="Your details"></h2>
          <p style="font-size:15px" data-ar="حقلان إلزاميان فقط. لن نسألك عن سبب الزيارة." data-en="Only two required fields. We will not ask your reason for visiting."></p>
        </div>

        <div class="fset" style="margin-top:18px">
          <div class="field">
            <label for="bkName" data-ar="الاسم الكامل" data-en="Full name"></label>
            <input id="bkName" name="name" type="text" autocomplete="name" required
                   data-ar-ph="اكتب اسمك كما تريده في الحجز" data-en-ph="Your name as you'd like it on the booking">
            <span class="err" id="errName" hidden></span>
          </div>

          <div class="field">
            <label for="bkPhone" data-ar="رقم الموبايل" data-en="Mobile number"></label>
            <input id="bkPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel"
                   pattern="01[0-9]{9}" maxlength="11" dir="ltr" required placeholder="01xxxxxxxxx">
            <span class="hint" data-ar="سيصلك التأكيد على هذا الرقم عبر واتساب." data-en="Your confirmation arrives on this number by WhatsApp."></span>
            <span class="err" id="errPhone" hidden></span>
          </div>

          <div class="field">
            <label for="bkNotes"><span data-ar="سبب الزيارة" data-en="Reason for visit"></span> <span class="opt" data-ar="(اختياري)" data-en="(optional)"></span></label>
            <textarea id="bkNotes" name="notes"
                      data-ar-ph="اتركه فارغًا إن فضّلت — يمكنك الشرح في العيادة." data-en-ph="Leave it blank if you prefer — you can explain at the clinic."></textarea>
          </div>

          <label class="checkline" for="bkOk">
            <input id="bkOk" type="checkbox" required>
            <span data-ar="أؤكد صحة رقم الموبايل المُدخل." data-en="I confirm the mobile number above is correct."></span>
          </label>
          <span class="err" id="errOk" hidden></span>

          <!-- Spam trap. Hidden from people and from screen readers; bots fill it
               in and the server silently drops the submission. Do not remove. -->
          <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px" tabindex="-1">
            <label for="bkCompany">Company</label>
            <input id="bkCompany" name="company" type="text" tabindex="-1" autocomplete="off">
          </div>
        </div>

        <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap">
          <button type="submit" class="btn btn-pri btn-lg" id="bkSubmit" data-ar="تأكيد الحجز" data-en="Confirm booking"></button>
          <button type="button" class="btn btn-out btn-lg" id="backTo1" data-ar="رجوع" data-en="Back"></button>
        </div>
      </form>
    </div>

    <!-- summary rail -->
    <aside style="display:flex;flex-direction:column;gap:14px">
      <div class="sum">
        <h3 data-ar="ملخّص حجزك" data-en="Your booking"></h3>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="sum-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.8"/></svg>
            <span><small data-ar="العيادة" data-en="Clinic"></small><b id="sumClinic"></b></span>
          </div>
          <div class="sum-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
            <span><small data-ar="اليوم" data-en="Day"></small><b id="sumDay"></b></span>
          </div>
          <div class="sum-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
            <span><small data-ar="الوقت" data-en="Time"></small><b id="sumTime"></b></span>
          </div>
        </div>
        <button type="button" class="btn btn-pri" id="toStep2" disabled style="width:100%">
          <span data-ar="متابعة — اسمك ورقمك" data-en="Continue — name &amp; number"></span>
          <svg class="arw" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <span class="sum-note" data-ar="حقلان فقط في الخطوة التالية. سبب الزيارة اختياري." data-en="Only two fields next. Reason for visit is optional."></span>
      </div>

      <div class="assure">
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-ar="الدفع في العيادة فقط" data-en="Pay at the clinic only"></span></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-ar="تأكيد خلال ساعتين" data-en="Confirmed within 2 hours"></span></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-ar="لا نطلب سبب الزيارة" data-en="We never ask your reason for visiting"></span></div>
      </div>

      <div class="phone-box">
        <b data-ar="تفضّل الحجز بالتليفون؟" data-en="Prefer to book by phone?"></b>
        <p data-ar="اتصل أو راسلنا على واتساب وسنحجز لك مباشرة." data-en="Call or message us on WhatsApp and we'll book it for you."></p>
        <div class="row">
          <a class="btn btn-ink" href="#" onclick="return false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-ar="واتساب" data-en="WhatsApp"></span></a>
          <a class="btn btn-out" href="#" onclick="return false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span data-ar="اتصال" data-en="Call"></span></a>
        </div>
      </div>
    </aside>
  </div>

  <!-- ========== STEP 3 ========== -->
  <div class="wrap" id="step3" hidden>
    <div class="done">
      <span class="done-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <h1 style="font-size:clamp(28px,4vw,44px)" data-ar="تم استلام طلب الحجز" data-en="Booking request received"></h1>
      <p data-ar="سنؤكّد الموعد عبر واتساب خلال ساعتين كحد أقصى في مواعيد العمل. الدفع في العيادة يوم الزيارة." data-en="We'll confirm by WhatsApp within two hours during working hours. Payment at the clinic on the day."></p>

      <dl class="recap">
        <div><dt data-ar="الاسم" data-en="Name"></dt><dd id="okName"></dd></div>
        <div><dt data-ar="رقم واتساب" data-en="WhatsApp number"></dt><dd id="okPhone" dir="ltr"></dd></div>
        <div><dt data-ar="العيادة" data-en="Clinic"></dt><dd id="okClinic"></dd></div>
        <div><dt data-ar="الموعد" data-en="Appointment"></dt><dd id="okWhen"></dd></div>
        <div><dt data-ar="رقم الطلب" data-en="Reference"></dt><dd id="okRef" class="num" dir="ltr"></dd></div>
      </dl>

      <p style="font-size:14px" data-ar="هذه نسخة تجريبية — لم تُرسل أي بيانات إلى أي جهة." data-en="This is a demo — no data was sent anywhere."></p>

      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <a class="btn btn-out" href="#/ar/home" data-route="home" data-ar="العودة للرئيسية" data-en="Back to home"></a>
        <button type="button" class="btn btn-pri" id="againBtn" data-ar="حجز موعد آخر" data-en="Book another appointment"></button>
      </div>
    </div>
  </div>

</section>
